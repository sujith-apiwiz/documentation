"""
The root query type that allows fetching data.
"""
type Query {
  """
  Retrieves a list of traffic records based on specific input parameters.
  """
  searchTraffics(
  """
  The criteria in JSON format used to filter the search results.
  """
  input: JSON!): [SearchTraffics]
}

"""
Represents a traffic record with various details.
"""
type SearchTraffics {
  """
  A unique identifier for the traffic record.
  """
  id: Int
  """
  The name associated with the traffic record.
  """
  name: String
  """
  The current status of the traffic record.
  """
  status: String
  """
  The date and time when the traffic record was created.
  """
  createdAt: String
  """
  The currency in which the traffic record is denoted.
  """
  currency: String
  """
  The owner details associated with the traffic record.
  """
  owner: Owner
}

"""
Represents the owner of a traffic record with their details.
"""
type Owner {
  """
  A unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
