"""
The root query type for fetching payee information.
"""
type Query {
  """
  Retrieves a list of payees based on the provided identifier.
  """
  getPayee(
  """
  The unique identifier of the payee to be fetched.
  """
  id: ID!): [GetPayee]
}

"""
Represents a payee with relevant details.
"""
type GetPayee {
  """
  The unique identifier of the payee.
  """
  id: Int
  """
  The name of the payee.
  """
  name: String
  """
  The current status of the payee.
  """
  status: String
  """
  A reference associated with the payee.
  """
  reference: String
  """
  A unique code representing the payee.
  """
  code: String
}
