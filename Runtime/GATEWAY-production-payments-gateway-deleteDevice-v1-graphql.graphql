"""
This type contains operations for modifying data.
"""
type Mutation {
  """
  Removes a device from the system based on its identifier.
  """
  deleteDevice(
  """
  The unique identifier of the device to be deleted.
  """
  id: ID!): [DeleteDevice]
}

"""
Represents a device that has been deleted.
"""
type DeleteDevice {
  """
  The unique identifier of the deleted device.
  """
  id: Int
  """
  The name of the deleted device.
  """
  name: String
  """
  The operational status of the deleted device.
  """
  status: String
  """
  A reference code associated with the deleted device.
  """
  reference: String
  """
  The currency used for transactions related to the deleted device.
  """
  currency: String
}

