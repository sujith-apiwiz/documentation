"""
Handles operations that modify data in the system.
"""
type Mutation {
  """
  Updates the information of a bot.
  """
  updateBot(
  """
  The unique identifier of the bot that needs to be updated.
  """
  id: ID!): [UpdateBot]
}

"""
Represents the updated information of a bot.
"""
type UpdateBot {
  """
  The unique identifier of the bot.
  """
  id: Int
  """
  The name of the bot.
  """
  name: String
  """
  Current operational status of the bot.
  """
  status: String
  """
  Timestamp indicating when the bot was created.
  """
  createdAt: String
  """
  The type or category of the bot.
  """
  type: String
}

