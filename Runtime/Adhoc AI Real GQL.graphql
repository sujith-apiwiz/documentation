"""
The root query type provides entry points for retrieving data.
"""
type Query {
  """
  Fetches details about a specific product based on its identifier.
  """
  getProduct(
  """
  The unique identifier for the product being requested.
  """
  id: ID!): GetProduct
}

"""
Represents the details of a product returned from a query.
"""
type GetProduct {
  """
  The unique identifier of the product.
  """
  id: ID
  """
  The name of the product.
  """
  name: String
  """
  The price of the product in currency format.
  """
  price: Float
}
