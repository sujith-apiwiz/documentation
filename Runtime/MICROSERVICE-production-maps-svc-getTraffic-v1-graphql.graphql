"""
The root query type for fetching traffic data.
"""
type Query {
  """
  Retrieves traffic information based on a unique identifier.
  """
  getTraffic(
  """
  The unique identifier for the traffic data.
  """
  id: ID!): [GetTraffic]
}

"""
Represents detailed information about traffic data.
"""
type GetTraffic {
  """
  The unique identifier for the traffic record.
  """
  id: Int
  """
  The name associated with the traffic data.
  """
  name: String
  """
  The current status of the traffic.
  """
  status: String
  """
  The timestamp indicating when the traffic record was created.
  """
  createdAt: String
  """
  The type of traffic being represented.
  """
  type: String
}
