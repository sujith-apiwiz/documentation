"""
Represents the entry point for querying data related to corridor fees.
"""
type Query {
  """
  Retrieves the details of a specific corridor fee.
  """
  getCorridorfee(
  """
  The unique identifier for the corridor fee.
  """
  id: ID!): [GetCorridorfee]
}

"""
Describes the properties of a corridor fee.
"""
type GetCorridorfee {
  """
  The unique identifier of the corridor fee.
  """
  id: Int
  """
  The name associated with the corridor fee.
  """
  name: String
  """
  The current status of the corridor fee.
  """
  status: String
  """
  Reference information related to the corridor fee.
  """
  reference: String
  """
  The type classification of the corridor fee.
  """
  type: String
}
