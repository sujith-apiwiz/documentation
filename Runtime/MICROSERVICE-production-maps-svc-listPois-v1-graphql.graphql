"""
The root query type for fetching data from the API.
"""
type Query {
  """
  Retrieves a list of Points of Interest (POIs).
  """
  listPois(
  """
  A JSON object that includes the parameters for filtering or searching the POIs.
  """
  input: JSON!): [ListPois]
}

"""
Represents a Point of Interest (POI) with various attributes.
"""
type ListPois {
  """
  The unique identifier for the POI.
  """
  id: Int
  """
  The name of the POI.
  """
  name: String
  """
  The current status of the POI, indicating availability or operational state.
  """
  status: String
  """
  The balance limit associated with the POI, likely for financial operations.
  """
  balanceLimit: Int
  """
  A code that represents the POI, possibly for categorization or identification.
  """
  code: String
}
