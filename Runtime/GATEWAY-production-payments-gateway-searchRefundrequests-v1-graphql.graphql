"""
The root query type that allows searching for refund requests.
"""
type Query {
  """
  Retrieves a list of refund requests based on the provided input.
  """
  searchRefundrequests(
  """
  A JSON object representing the search parameters for refund requests.
  """
  input: JSON!): [SearchRefundrequests]
}

"""
Represents the details of a refund request found in the search results.
"""
type SearchRefundrequests {
  """
  The unique identifier for the refund request.
  """
  id: Int
  """
  The name associated with the refund request.
  """
  name: String
  """
  The current status of the refund request.
  """
  status: String
  """
  The monetary amount involved in the refund request.
  """
  amount: Int
  """
  The type of refund request.
  """
  type: String
  """
  The owner details associated with the refund request.
  """
  owner: Owner
}

"""
Details about the owner of the refund request.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
