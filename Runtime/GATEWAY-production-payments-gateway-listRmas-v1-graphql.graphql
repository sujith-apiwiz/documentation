"""
This type represents the entry point for querying data related to RMAs.
"""
type Query {
  """
  Retrieves a list of RMAs based on the given input criteria.
  """
  listRmas(
  """
  A JSON object containing the input criteria for filtering RMAs.
  """
  input: JSON!): [ListRmas]
}

"""
Represents an individual RMA with its associated properties.
"""
type ListRmas {
  """
  A unique identifier for the RMA.
  """
  id: Int
  """
  The name or title of the RMA.
  """
  name: String
  """
  The current status of the RMA.
  """
  status: String
  """
  The total amount associated with the RMA.
  """
  amount: Int
  """
  The type or category of the RMA.
  """
  type: String
}
