"""
The main entry point for querying data in the system.
"""
type Query {
  """
  Retrieves information about a specific route based on the provided identifier.
  """
  getRoute(
  """
  The unique identifier for the route to be retrieved.
  """
  id: ID!): [GetRoute]
}

"""
Represents the details of a specific route.
"""
type GetRoute {
  """
  The unique identifier of the route.
  """
  id: Int
  """
  The name assigned to the route.
  """
  name: String
  """
  The current status of the route.
  """
  status: String
  """
  The balance limit applicable to the route.
  """
  balanceLimit: Int
  """
  The currency in which the balance limit is expressed.
  """
  currency: String
}
