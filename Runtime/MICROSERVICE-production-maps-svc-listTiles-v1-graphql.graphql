"""
The root query type that provides entry points for fetching data.
"""
type Query {
  """
  Retrieves a list of tiles based on the specified input criteria.
  """
  listTiles(
  """
  A JSON object containing the necessary parameters for fetching the list of tiles.
  """
  input: JSON!): [ListTiles]
}

"""
Represents a tile with various attributes.
"""
type ListTiles {
  """
  A unique identifier for the tile.
  """
  id: Int
  """
  The name or title of the tile.
  """
  name: String
  """
  The current status of the tile.
  """
  status: String
  """
  A reference identifier associated with the tile.
  """
  reference: String
  """
  The currency type related to the tile, if applicable.
  """
  currency: String
}
