"""
Root query type for fetching various data.
"""
type Query {
  """
  Retrieves a list of devices based on the provided input parameters.
  """
  listDevices(
  """
  A JSON object that specifies the parameters for filtering or searching devices.
  """
  input: JSON!): [ListDevices]
}

"""
Represents a device with its associated details.
"""
type ListDevices {
  """
  Unique identifier for the device.
  """
  id: Int
  """
  The name of the device.
  """
  name: String
  """
  Current operational status of the device.
  """
  status: String
  """
  Timestamp indicating when the device was created.
  """
  createdAt: String
  """
  Type category for the device.
  """
  type: String
}
