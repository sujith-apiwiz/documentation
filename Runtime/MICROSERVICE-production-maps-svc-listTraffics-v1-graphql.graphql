"""
This type serves as the entry point for querying traffic data.
"""
type Query {
  """
  Retrieves a list of traffic records based on the provided input.
  """
  listTraffics(
  """
  A JSON object containing parameters to filter or modify the list of traffics.
  """
  input: JSON!): [ListTraffics]
}

"""
Represents a single traffic record with relevant details.
"""
type ListTraffics {
  """
  A unique identifier for the traffic record.
  """
  id: Int
  """
  The name associated with the traffic record.
  """
  name: String
  """
  The current status of the traffic record.
  """
  status: String
  """
  The amount related to the traffic record.
  """
  amount: Int
  """
  A code representing the traffic record.
  """
  code: String
  """
  The owner associated with the traffic record.
  """
  owner: Owner
}

"""
Details about the owner of a traffic record.
"""
type Owner {
  """
  A unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
