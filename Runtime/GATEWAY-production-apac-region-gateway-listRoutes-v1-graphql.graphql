"""
The root query type that provides entry points for fetching data.
"""
type Query {
  """
  Fetches a list of route details based on the provided input.
  """
  listRoutes(
  """
  A JSON object that contains parameters for filtering or modifying the list of routes.
  """
  input: JSON!): [ListRoutes]
}

"""
Represents the details of a specific route.
"""
type ListRoutes {
  """
  The unique identifier for the route.
  """
  id: Int
  """
  The name of the route.
  """
  name: String
  """
  The current status of the route.
  """
  status: String
  """
  The numerical value associated with the route.
  """
  amount: Int
  """
  The category or type designation of the route.
  """
  type: String
}
