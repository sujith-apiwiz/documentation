"""
This type serves as the entry point for querying data in the system.
"""
type Query {
  """
  Retrieves a list of agents based on the provided search criteria.
  """
  searchAgents(
  """
  A JSON object containing the search parameters for agents.
  """
  input: JSON!): [SearchAgents]
}

"""
Represents an agent with its associated properties.
"""
type SearchAgents {
  """
  The unique identifier for the agent.
  """
  id: Int
  """
  The name of the agent.
  """
  name: String
  """
  The current status of the agent.
  """
  status: String
  """
  The maximum balance that the agent can handle.
  """
  balanceLimit: Int
  """
  A unique code assigned to the agent.
  """
  code: String
}
