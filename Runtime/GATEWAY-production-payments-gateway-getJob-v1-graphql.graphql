"""
The main entry point for querying job-related information.
"""
type Query {
  """
  Fetches job details based on the provided job ID.
  """
  getJob(
  """
  The unique identifier of the job to be retrieved.
  """
  id: ID!): [GetJob]
}

"""
Represents the details of a job.
"""
type GetJob {
  """
  The unique identifier for the job.
  """
  id: Int
  """
  The name or title associated with the job.
  """
  name: String
  """
  The current status of the job.
  """
  status: String
  """
  The limit on the balance for the job.
  """
  balanceLimit: Int
  """
  The currency in which the job's balance is denominated.
  """
  currency: String
}
