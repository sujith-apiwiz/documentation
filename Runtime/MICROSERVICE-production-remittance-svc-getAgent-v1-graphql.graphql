"""
The root query type for accessing data related to agents.
"""
type Query {
  """
  Retrieves a list of agents based on the specified ID.
  """
  getAgent(
  """
  The unique identifier of the agent to be fetched.
  """
  id: ID!): [GetAgent]
}

"""
Represents an agent with its associated properties.
"""
type GetAgent {
  """
  The unique identifier of the agent.
  """
  id: Int
  """
  The name of the agent.
  """
  name: String
  """
  The current status of the agent.
  """
  status: String
  """
  A reference code associated with the agent.
  """
  reference: String
  """
  The code related to the agent.
  """
  code: String
}
