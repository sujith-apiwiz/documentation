"""
The root query type for fetching data.
"""
type Query {
  """
  Retrieves a list of senders based on the provided input.
  """
  listSenders(
  """
  A JSON object containing the parameters to filter the senders.
  """
  input: JSON!): [ListSenders]
}

"""
Represents a sender with relevant details.
"""
type ListSenders {
  """
  The unique identifier for the sender.
  """
  id: Int
  """
  The name of the sender.
  """
  name: String
  """
  The current operational status of the sender.
  """
  status: String
  """
  The maximum balance limit for the sender.
  """
  balanceLimit: Int
  """
  The code associated with the sender.
  """
  code: String
  """
  The owner of the sender.
  """
  owner: Owner
}

"""
Details about the owner of a sender.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
