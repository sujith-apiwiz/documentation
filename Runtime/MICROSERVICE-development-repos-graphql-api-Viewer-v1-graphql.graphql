"""
The root query type for retrieving data.
"""
type Query {
  """
  Fetches the details of the current user.
  """
  viewer: Viewer
}

"""
Represents the user currently interacting with the system.
"""
type Viewer {
  """
  The unique login identifier for the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about a user's repositories.
"""
type Repositories {
  """
  The total number of repositories the user has.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of the repository's purpose.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Represents the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}
