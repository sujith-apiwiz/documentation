type Query {
  viewer: Viewer
}

type Viewer {
  login: String
  name: String
  bio: String
  repositories: Repositories
}

type Repositories {
  totalCount: Int
  nodes: [Nodes]
}

type Nodes {
  name: String
  description: String
  stargazerCount: Int
  forkCount: Int
  primaryLanguage: PrimaryLanguage
}

type PrimaryLanguage {
  name: String
  color: String
}
