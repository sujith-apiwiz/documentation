"""
The entry point for accessing the application’s data.
"""
type Query {
  """
  Represents the currently authenticated user.
  """
  viewer: Viewer
}

"""
Describes the user profile, including authentication details.
"""
type Viewer {
  """
  The username of the viewer.
  """
  login: String
  """
  The full name of the viewer.
  """
  name: String
  """
  A brief biography of the viewer.
  """
  bio: String
  """
  The list of repositories owned or contributed to by the viewer.
  """
  repositories: Repositories
}

"""
Contains details about the viewer's repositories.
"""
type Repositories {
  """
  The total number of repositories associated with the viewer.
  """
  totalCount: Int
  """
  An array of repository objects linked to the viewer.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository with specific attributes.
"""
type Nodes {
  """
  The title of the repository.
  """
  name: String
  """
  A brief description of the repository's purpose.
  """
  description: String
  """
  The number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language, often used for visual representation.
  """
  color: String
}
