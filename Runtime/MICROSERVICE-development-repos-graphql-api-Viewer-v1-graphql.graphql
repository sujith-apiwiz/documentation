"""
The root entry point for accessing the application's data.
"""
type Query {
  """
  Represents the currently authenticated user.
  """
  viewer: Viewer
}

"""
Contains information about the authenticated user's profile.
"""
type Viewer {
  """
  The login username of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography provided by the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories.
"""
type Repositories {
  """
  The total number of repositories in the collection.
  """
  totalCount: Int
  """
  An array of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of the repository.
  """
  description: String
  """
  The number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Describes the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}
