"""
The root query type for fetching information about the current user.
"""
type Query {
  """
  Provides details about the authenticated user.
  """
  viewer: Viewer
}

"""
Represents the user's profile information.
"""
type Viewer {
  """
  The unique login identifier for the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about a user's repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of repository nodes owned by the user.
  """
  nodes: [Nodes]
}

"""
Represents a single repository with its relevant details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of the repository.
  """
  description: String
  """
  The number of stars received by the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Describes the main programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The associated color used to represent the programming language.
  """
  color: String
}
