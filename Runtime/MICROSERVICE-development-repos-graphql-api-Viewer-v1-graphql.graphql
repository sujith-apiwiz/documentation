"""
The root query for fetching data regarding the viewer and their repositories.
"""
type Query {
  """
  Retrieves information about the current user, including their profile and repositories.
  """
  viewer: Viewer
}

"""
Contains details about the authenticated user, such as their login and repositories.
"""
type Viewer {
  """
  The unique login identifier of the viewer.
  """
  login: String
  """
  The full name of the viewer.
  """
  name: String
  """
  A short biography or description provided by the viewer.
  """
  bio: String
  """
  A collection of repositories owned or contributed to by the viewer.
  """
  repositories: Repositories
}

"""
Represents a list of repositories along with their total count.
"""
type Repositories {
  """
  The total number of repositories found for the viewer.
  """
  totalCount: Int
  """
  An array of individual repositories associated with the viewer.
  """
  nodes: [Nodes]
}

"""
Describes an individual repository with relevant details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of what the repository is about.
  """
  description: String
  """
  The number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The total number of forks made from the repository.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details regarding the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary language.
  """
  name: String
  """
  A color representation associated with the primary language.
  """
  color: String
}
