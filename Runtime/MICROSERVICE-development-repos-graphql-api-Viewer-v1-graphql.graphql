"""
The root query type for accessing various data fields.
"""
type Query {
  """
  Represents the currently authenticated user and their related data.
  """
  viewer: Viewer
}

"""
Contains information about the viewer including their account details.
"""
type Viewer {
  """
  The unique login identifier for the viewer.
  """
  login: String
  """
  The full name of the viewer.
  """
  name: String
  """
  A brief biography or description about the viewer.
  """
  bio: String
  """
  The repositories owned by the viewer.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the viewer.
  """
  totalCount: Int
  """
  An array of individual repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of the repository's purpose or content.
  """
  description: String
  """
  The number of stargazers (users who have starred the repository).
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Represents the primary programming language for a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The associated color code for the programming language.
  """
  color: String
}
