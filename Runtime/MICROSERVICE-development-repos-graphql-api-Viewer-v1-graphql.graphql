"""
The entry point for all data retrieval queries.
"""
type Query {
  """
  Represents the currently authenticated user.
  """
  viewer: Viewer
}

"""
Contains information about the user's profile.
"""
type Viewer {
  """
  The username of the viewer.
  """
  login: String
  """
  The full name of the viewer.
  """
  name: String
  """
  A short biography or description of the viewer.
  """
  bio: String
  """
  A collection of repositories owned or contributed to by the viewer.
  """
  repositories: Repositories
}

"""
Details the repositories associated with a user.
"""
type Repositories {
  """
  The total number of repositories.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary language.
  """
  name: String
  """
  The color associated with the primary programming language.
  """
  color: String
}
