"""
The root query type for accessing firmware information.
"""
type Query {
  """
  Retrieves a list of firmware details based on the provided search criteria.
  """
  searchFirmwares(
  """
  The search criteria in JSON format used to filter the firmware results.
  """
  input: JSON!): [SearchFirmwares]
}

"""
Represents the details of a firmware matching the search criteria.
"""
type SearchFirmwares {
  """
  The unique identifier for the firmware.
  """
  id: Int
  """
  The name of the firmware.
  """
  name: String
  """
  The current status of the firmware.
  """
  status: String
  """
  A reference code associated with the firmware.
  """
  reference: String
  """
  The unique code for the firmware.
  """
  code: String
  """
  The owner details associated with the firmware.
  """
  owner: Owner
}

"""
Details about the owner of the firmware.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
