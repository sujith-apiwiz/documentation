"""
The root query type for retrieving information from the system.
"""
type Query {
  """
  Fetches the details of a specific trigger based on its ID.
  """
  getTrigger(
  """
  The unique identifier of the trigger to be retrieved.
  """
  id: ID!): [GetTrigger]
}

"""
Represents the details of a trigger.
"""
type GetTrigger {
  """
  The unique identifier of the trigger.
  """
  id: Int
  """
  The name of the trigger.
  """
  name: String
  """
  The current status of the trigger.
  """
  status: String
  """
  The date and time when the trigger was created.
  """
  createdAt: String
  """
  The currency associated with the trigger.
  """
  currency: String
  """
  Details about the owner of the trigger.
  """
  owner: Owner
}

"""
Represents the owner of a trigger.
"""
type Owner {
  """
  The unique identifier of the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
