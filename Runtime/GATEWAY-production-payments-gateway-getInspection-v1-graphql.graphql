"""
The root query type provides entry points for fetching inspection data.
"""
type Query {
  """
  Retrieves a list of inspection records based on the specified ID.
  """
  getInspection(
  """
  The unique identifier of the inspection to be fetched.
  """
  id: ID!): [GetInspection]
}

"""
Represents details of an inspection, including its characteristics.
"""
type GetInspection {
  """
  The unique identifier for the inspection.
  """
  id: Int
  """
  The name or title of the inspection.
  """
  name: String
  """
  Current status of the inspection.
  """
  status: String
  """
  The monetary amount associated with the inspection.
  """
  amount: Int
  """
  Currency type in which the inspection amount is denominated.
  """
  currency: String
}
