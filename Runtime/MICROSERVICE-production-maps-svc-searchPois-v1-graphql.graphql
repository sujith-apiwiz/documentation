"""
Represents the entry point for querying data.
"""
type Query {
  """
  Retrieves a list of points of interest based on the provided input.
  """
  searchPois(
  """
  A JSON object containing the search criteria for points of interest.
  """
  input: JSON!): [SearchPois]
}

"""
Represents a point of interest with its associated details.
"""
type SearchPois {
  """
  Unique identifier for the point of interest.
  """
  id: Int
  """
  The name of the point of interest.
  """
  name: String
  """
  Current status of the point of interest.
  """
  status: String
  """
  Reference information for the point of interest.
  """
  reference: String
  """
  The category or type of the point of interest.
  """
  type: String
}
