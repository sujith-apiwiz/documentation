"""
The root query type for retrieving bot information.
"""
type Query {
  """
  Fetches a list of bots based on the provided input criteria.
  """
  listBots(
  """
  Criteria in JSON format to filter the bot listings.
  """
  input: JSON!): [ListBots]
}

"""
Represents a bot with its associated details.
"""
type ListBots {
  """
  The unique identifier for the bot.
  """
  id: Int
  """
  The name of the bot.
  """
  name: String
  """
  The current operational status of the bot.
  """
  status: String
  """
  A reference or identifier related to the bot.
  """
  reference: String
  """
  The code or script associated with the bot.
  """
  code: String
}
