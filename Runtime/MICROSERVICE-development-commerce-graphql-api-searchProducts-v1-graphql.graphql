"""
The query type serves as the entry point for fetching data from the GraphQL API.
"""
type Query {
  """
  Initiates a search for products based on provided criteria.
  """
  searchProducts: SearchProducts
}

"""
Represents the result of a product search operation.
"""
type SearchProducts {
  """
  A placeholder string field that may denote the lack of specific information.
  """
  _empty: String
}
