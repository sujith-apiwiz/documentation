"""
Represents the entry point for querying data.
"""
type Query {
  """
  Retrieves a list of tile data based on the provided input.
  """
  searchTiles(
  """
  The JSON input containing search parameters for filtering tiles.
  """
  input: JSON!): [SearchTiles]
}

"""
Represents a tile object containing relevant details.
"""
type SearchTiles {
  """
  A unique identifier for the tile.
  """
  id: Int
  """
  The name of the tile.
  """
  name: String
  """
  The current status of the tile.
  """
  status: String
  """
  The amount associated with the tile.
  """
  amount: Int
  """
  The type category of the tile.
  """
  type: String
}
