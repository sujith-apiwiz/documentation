"""
Represents the entry point for querying data in the system.
"""
type Query {
  """
  Retrieves a list of transfer objects based on the specified input parameters.
  """
  listTransfers(
  """
  A JSON object that contains the parameters for listing transfers.
  """
  input: JSON!): [ListTransfers]
}

"""
Represents a transfer entity with its associated attributes.
"""
type ListTransfers {
  """
  A unique identifier for the transfer.
  """
  id: Int
  """
  The name associated with the transfer.
  """
  name: String
  """
  The current status of the transfer.
  """
  status: String
  """
  The limit on the balance for the transfer.
  """
  balanceLimit: Int
  """
  A code representing the transfer.
  """
  code: String
}
