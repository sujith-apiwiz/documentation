"""
Represents the entry point for fetching tile information.
"""
type Query {
  """
  Returns a list of tiles based on the provided identifier.
  """
  getTile(
  """
  The unique identifier for a specific tile.
  """
  id: ID!): [GetTile]
}

"""
Represents the details of a specific tile.
"""
type GetTile {
  """
  The unique identifier of the tile.
  """
  id: Int
  """
  The name associated with the tile.
  """
  name: String
  """
  The current status of the tile.
  """
  status: String
  """
  Any reference information related to the tile.
  """
  reference: String
  """
  The classification type of the tile.
  """
  type: String
}
