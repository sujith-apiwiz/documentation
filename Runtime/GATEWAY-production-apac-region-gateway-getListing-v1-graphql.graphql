"""
The root query type for fetching data.
"""
type Query {
  """
  Retrieves a listing by its unique identifier.
  """
  getListing(
  """
  The unique identifier of the listing to be fetched.
  """
  id: ID!): [GetListing]
}

"""
Represents a listing with its attributes.
"""
type GetListing {
  """
  The unique identifier of the listing.
  """
  id: Int
  """
  The name of the listing.
  """
  name: String
  """
  The current status of the listing.
  """
  status: String
  """
  The monetary amount associated with the listing.
  """
  amount: Int
  """
  The type/category of the listing.
  """
  type: String
}
