"""
This type represents the various operations that can modify data within the system.
"""
type Mutation {
  """
  This field allows the user to update tile information based on the provided ID.
  """
  updateTile(
  """
  The unique identifier of the tile that needs to be updated.
  """
  id: ID!): [UpdateTile]
}

"""
This type encapsulates the details of a tile update.
"""
type UpdateTile {
  """
  The unique identifier of the tile.
  """
  id: Int
  """
  The name of the tile.
  """
  name: String
  """
  The current status of the tile.
  """
  status: String
  """
  The quantity associated with the tile.
  """
  amount: Int
  """
  The currency in which the tile's amount is denominated.
  """
  currency: String
}

