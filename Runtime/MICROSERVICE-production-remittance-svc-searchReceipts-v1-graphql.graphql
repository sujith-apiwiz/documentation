"""
This type provides methods for querying data.
"""
type Query {
  """
  Retrieves a list of receipts based on the provided input.
  """
  searchReceipts(
  """
  The criteria used to search for receipts, provided in JSON format.
  """
  input: JSON!): [SearchReceipts]
}

"""
Represents the details of a receipt found through a search.
"""
type SearchReceipts {
  """
  The unique identifier of the receipt.
  """
  id: Int
  """
  The name associated with the receipt.
  """
  name: String
  """
  The current status of the receipt.
  """
  status: String
  """
  The budget limit related to the receipt.
  """
  balanceLimit: Int
  """
  The category or type of the receipt.
  """
  type: String
}
