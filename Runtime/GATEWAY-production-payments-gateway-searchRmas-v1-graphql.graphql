"""
The root query type that serves as the entry point for the API.
"""
type Query {
  """
  Retrieves a list of RMAs based on the provided input criteria.
  """
  searchRmas(
  """
  The criteria used to filter the RMAs in the search.
  """
  input: JSON!): [SearchRmas]
}

"""
Represents the information of a returned merchandise authorization (RMA).
"""
type SearchRmas {
  """
  The unique identifier of the RMA.
  """
  id: Int
  """
  The name associated with the RMA.
  """
  name: String
  """
  The current status of the RMA.
  """
  status: String
  """
  The balance limit associated with the RMA.
  """
  balanceLimit: Int
  """
  The code associated with the RMA.
  """
  code: String
}
