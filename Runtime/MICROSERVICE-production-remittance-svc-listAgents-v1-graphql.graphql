"""
The root query type for retrieving data related to agents.
"""
type Query {
  """
  Fetches a list of agents based on specified criteria.
  """
  listAgents(
  """
  A JSON object that contains filters for the agents to be retrieved.
  """
  input: JSON!): [ListAgents]
}

"""
Represents an agent with its associated details.
"""
type ListAgents {
  """
  The unique identifier for the agent.
  """
  id: Int
  """
  The name of the agent.
  """
  name: String
  """
  The current status of the agent.
  """
  status: String
  """
  A reference code associated with the agent.
  """
  reference: String
  """
  The category or type of the agent.
  """
  type: String
}
