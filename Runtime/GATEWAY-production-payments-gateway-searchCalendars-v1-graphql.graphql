"""
The Query type provides access to various query operations.
"""
type Query {
  """
  Retrieves a list of calendars based on the specified search criteria.
  """
  searchCalendars(
  """
  The criteria used to filter the calendars in the search.
  """
  input: JSON!): [SearchCalendars]
}

"""
Represents a calendar with its associated attributes.
"""
type SearchCalendars {
  """
  The unique identifier for the calendar.
  """
  id: Int
  """
  The name of the calendar.
  """
  name: String
  """
  The current status of the calendar.
  """
  status: String
  """
  The maximum balance limit associated with the calendar.
  """
  balanceLimit: Int
  """
  A unique code that identifies the calendar.
  """
  code: String
}
