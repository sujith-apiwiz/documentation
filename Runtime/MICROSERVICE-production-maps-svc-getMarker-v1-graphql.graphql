"""
This type serves as the entry point for querying the graph, providing access to various data retrieval functionalities.
"""
type Query {
  """
  Retrieves a list of markers based on the given identifier.
  """
  getMarker(
  """
  The unique identifier of the marker to retrieve.
  """
  id: ID!): [GetMarker]
}

"""
Represents a marker object with various attributes such as identification, name, status, amount, and type.
"""
type GetMarker {
  """
  The unique identifier of the marker.
  """
  id: Int
  """
  The name assigned to the marker.
  """
  name: String
  """
  Current status of the marker.
  """
  status: String
  """
  The associated amount related to the marker.
  """
  amount: Int
  """
  The classification type of the marker.
  """
  type: String
}
