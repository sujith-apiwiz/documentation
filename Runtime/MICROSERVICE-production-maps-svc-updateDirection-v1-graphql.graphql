"""
Handles updates to various data entities within the application.
"""
type Mutation {
  """
  Returns a list of updated direction objects based on the provided ID.
  """
  updateDirection(
  """
  The unique identifier of the direction to be updated.
  """
  id: ID!): [UpdateDirection]
}

"""
Represents the details of a direction that has been updated.
"""
type UpdateDirection {
  """
  The unique identifier for this direction.
  """
  id: Int
  """
  The name associated with the direction.
  """
  name: String
  """
  The current status of the direction.
  """
  status: String
  """
  The numerical amount related to the direction.
  """
  amount: Int
  """
  The currency in which the amount is expressed.
  """
  currency: String
}

