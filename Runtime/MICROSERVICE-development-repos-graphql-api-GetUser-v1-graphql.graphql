"""
The entry point for fetching data in the application.
"""
type Query {
  """
  Retrieves information about a specific user based on their login.
  """
  user(
  """
  The unique identifier for the user.
  """
  login: String!): User
}

"""
Represents a user in the system with various personal details.
"""
type User {
  """
  The unique login identifier of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography or description of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about the user's repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of repository nodes representing individual repositories.
  """
  nodes: [Nodes]
}

"""
Represents individual repository details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of what the repository contains.
  """
  description: String
  """
  The number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language for visualization.
  """
  color: String
}
