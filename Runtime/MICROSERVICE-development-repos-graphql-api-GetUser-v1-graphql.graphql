"""
The root query type that allows fetching user data.
"""
type Query {
  """
  Fetches a user by their login identifier.
  """
  user(
  """
  The unique login identifier of the user to retrieve.
  """
  login: String!): User
}

"""
Represents a user with their personal and repository information.
"""
type User {
  """
  The unique login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography or description of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Holds information about the repositories including count and details.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of repositories owned by the user.
  """
  nodes: [Nodes]
}

"""
Represents a single repository with relevant details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary language used in a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary language.
  """
  name: String
  """
  The color associated with the primary language.
  """
  color: String
}
