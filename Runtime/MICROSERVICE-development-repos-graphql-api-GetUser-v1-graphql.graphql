"""
The Query type serves as the entry point for fetching data from the API.
"""
type Query {
  """
  Retrieves a user by their login identifier.
  """
  user(
  """
  The unique identifier for the user.
  """
  login: String!): User
}

"""
Represents a user in the system with attributes and their repositories.
"""
type User {
  """
  The login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography of the user.
  """
  bio: String
  """
  The list of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Holds information about a user’s repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  An array of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents a single repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A short description of what the repository is about.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language used in a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color associated with the primary programming language.
  """
  color: String
}
