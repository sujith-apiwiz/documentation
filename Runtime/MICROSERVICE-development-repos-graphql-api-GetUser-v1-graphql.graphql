"""
This type defines the entry points for querying user information.
"""
type Query {
  """
  Fetches details about a user based on their login.
  """
  user(
  """
  The unique login identifier for the user.
  """
  login: String!): User
}

"""
Represents a user with various attributes including their repositories.
"""
type User {
  """
  The unique login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography or description of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains a list of repositories along with their total count.
"""
type Repositories {
  """
  The total number of repositories associated with the user.
  """
  totalCount: Int
  """
  An array of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of what the repository is about.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color code associated with the primary programming language.
  """
  color: String
}
