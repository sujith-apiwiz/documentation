"""
This type serves as the entry point for querying user-related information.
"""
type Query {
  """
  Fetches a user based on their login identifier.
  """
  user(
  """
  The unique login identifier of the user to retrieve.
  """
  login: String!): User
}

"""
Represents a user with specific attributes related to their profile.
"""
type User {
  """
  The unique login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography or description of the user.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about the user's repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of individual repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}
