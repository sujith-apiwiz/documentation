"""
The root query type for fetching user information.
"""
type Query {
  """
  Fetches a user based on their login.
  """
  user(
  """
  The login identifier of the user to retrieve.
  """
  login: String!): User
}

"""
Represents a user with various attributes.
"""
type User {
  """
  The login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A brief biography of the user.
  """
  bio: String
  """
  The repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about a user's repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of the user's repositories.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A description of what the repository is about.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language of the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}
