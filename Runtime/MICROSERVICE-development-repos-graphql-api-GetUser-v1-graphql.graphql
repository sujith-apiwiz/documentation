"""
The root query type for fetching user information.
"""
type Query {
  """
  Fetches a user by their login identifier.
  """
  user(
  """
  The unique login identifier of the user.
  """
  login: String!): User
}

"""
Represents a user with various attributes including their repositories.
"""
type User {
  """
  The login name of the user.
  """
  login: String
  """
  The full name of the user.
  """
  name: String
  """
  A short biography or description of the user.
  """
  bio: String
  """
  The repositories owned by the user.
  """
  repositories: Repositories
}

"""
Contains information about a collection of repositories.
"""
type Repositories {
  """
  The total number of repositories owned by the user.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents a single repository with its details.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}
