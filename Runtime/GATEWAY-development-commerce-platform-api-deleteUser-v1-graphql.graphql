"""
The Mutation type contains operations that modify data.
"""
type Mutation {
  """
  This operation facilitates the removal of a user from the system.
  """
  deleteUser: DeleteUser
}

"""
The DeleteUser type represents the result of a user deletion operation.
"""
type DeleteUser {
  """
  This field signifies an empty response for the delete operation.
  """
  _empty: String
}

