"""
The root query type for fetching data from the system.
"""
type Query {
  """
  Retrieves firmware details based on the provided identifier.
  """
  getFirmware(
  """
  The unique identifier for the firmware being queried.
  """
  id: ID!): [GetFirmware]
}

"""
Represents the details of a firmware item.
"""
type GetFirmware {
  """
  The unique identifier of the firmware.
  """
  id: Int
  """
  The name or title of the firmware.
  """
  name: String
  """
  The current status of the firmware, indicating its operational condition.
  """
  status: String
  """
  The quantity of the firmware available.
  """
  amount: Int
  """
  The code associated with the firmware, possibly representing a version or reference.
  """
  code: String
}
