"""
Handles operations that create or modify data within the system.
"""
type Mutation {
  """
  Creates a new bot based on the provided input.
  """
  createBot(
  """
  A JSON object containing the necessary information to create a bot.
  """
  input: JSON!): [CreateBot]
}

"""
Represents the details of a newly created bot.
"""
type CreateBot {
  """
  The unique identifier of the bot.
  """
  id: Int
  """
  The name of the bot.
  """
  name: String
  """
  The current operational status of the bot.
  """
  status: String
  """
  The limit of the balance that the bot can manage.
  """
  balanceLimit: Int
  """
  The unique code associated with the bot.
  """
  code: String
  """
  The owner of the bot, including their details.
  """
