"""
This type provides entry points for fetching compliance check information.
"""
type Query {
  """
  Retrieves a list of compliance checks based on the provided input criteria.
  """
  listCompliancechecks(
  """
  A JSON object that defines the search criteria for compliance checks.
  """
  input: JSON!): [ListCompliancechecks]
}

"""
An object representing a compliance check, including its details and current status.
"""
type ListCompliancechecks {
  """
  A unique identifier for the compliance check.
  """
  id: Int
  """
  The name assigned to the compliance check.
  """
  name: String
  """
  The current status of the compliance check.
  """
  status: String
  """
  A reference identifier related to the compliance check.
  """
  reference: String
  """
  The category or type of compliance check.
  """
  type: String
  """
  Details about the owner responsible for the compliance check.
  """
  owner: Owner
}

"""
An object containing information about the owner of a compliance check.
"""
type Owner {
  """
  A unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
