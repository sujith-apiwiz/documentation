"""
This type serves as the entry point for querying compliance checks.
"""
type Query {
  """
  Retrieves a list of compliance checks based on the given input.
  """
  searchCompliancechecks(
  """
  A JSON object that specifies the criteria for searching compliance checks.
  """
  input: JSON!): [SearchCompliancechecks]
}

"""
Represents a compliance check with various associated details.
"""
type SearchCompliancechecks {
  """
  The unique identifier for the compliance check.
  """
  id: Int
  """
  The name of the compliance check.
  """
  name: String
  """
  Current status of the compliance check.
  """
  status: String
  """
  The monetary amount associated with the compliance check.
  """
  amount: Int
  """
  A code that relates to the compliance check.
  """
  code: String
  """
  Details about the owner of the compliance check.
  """
  owner: Owner
}

"""
Information about the owner of a compliance check.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
