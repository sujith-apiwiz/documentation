"""
This type represents the entry point for querying data in the application.
"""
type Query {
  """
  Retrieves a list of orders available in the system.
  """
  listOrders: ListOrders
}

"""
This type encapsulates the response structure for a list of orders.
"""
type ListOrders {
  """
  A placeholder field that indicates the absence of content.
  """
  _empty: String
}
