"""
The root query type allowing clients to retrieve compliance check data.
"""
type Query {
  """
  Fetches a list of compliance checks based on a specified identifier.
  """
  getCompliancecheck(
  """
  A unique identifier for the compliance check.
  """
  id: ID!): [GetCompliancecheck]
}

"""
Represents a compliance check with its associated details.
"""
type GetCompliancecheck {
  """
  The unique identifier of the compliance check.
  """
  id: Int
  """
  The name assigned to the compliance check.
  """
  name: String
  """
  The current status of the compliance check.
  """
  status: String
  """
  The balance limit relevant to the compliance check.
  """
  balanceLimit: Int
  """
  The category or type of the compliance check.
  """
  type: String
}
