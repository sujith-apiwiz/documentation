"""
The entry point for querying data related to conversations.
"""
type Query {
  """
  Retrieves a list of conversations based on the provided search criteria.
  """
  searchConversations(
  """
  A JSON object containing the parameters for the search.
  """
  input: JSON!): [SearchConversations]
}

"""
Represents a conversation and its associated properties.
"""
type SearchConversations {
  """
  The unique identifier for the conversation.
  """
  id: Int
  """
  The name of the conversation.
  """
  name: String
  """
  The current status of the conversation.
  """
  status: String
  """
  The total amount associated with the conversation.
  """
  amount: Int
  """
  A specific code related to the conversation.
  """
  code: String
  """
  The owner of the conversation and their details.
  """
  owner: Owner
}

"""
Details about the owner of a conversation.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
