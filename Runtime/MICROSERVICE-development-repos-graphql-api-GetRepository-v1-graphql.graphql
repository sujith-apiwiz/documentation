"""
The root query object for accessing various data about repositories.
"""
type Query {
  """
  Fetches a specific repository based on the owner and name provided.
  """
  repository(
  """
  The username of the repository's owner.
  """
  owner: String!
  """
  The name of the repository.
  """
  name: String!): Repository
}

"""
Represents a software repository with its associated details.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The total number of stars given to the repository.
  """
  stargazerCount: Int
  """
  The total number of times the repository has been forked.
  """
  forkCount: Int
  """
  Details about the primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  Information about the owner of the repository.
  """
  owner: Owner
}

"""
Describes the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color associated with the primary programming language.
  """
  color: String
}

"""
Contains details about the owner of the repository.
"""
type Owner {
  """
  The login username of the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A short biography of the owner.
  """
  bio: String
  """
  Information about the repositories owned by the owner.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories owned by a specific owner.
"""
type Repositories {
  """
  The total number of repositories owned.
  """
  totalCount: Int
  """
  A list of individual repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository node.
"""
type Nodes {
  """
  The name of the repository node.
  """
  name: String
}
