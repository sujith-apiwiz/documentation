"""
Allows querying information about repositories.
"""
type Query {
  """
  Fetches a specific repository based on the owner's name and the repository's name.
  """
  repository(
  """
  The username of the repository owner.
  """
  owner: String!
  """
  The name of the repository to retrieve.
  """
  name: String!): Repository
}

"""
Represents a software repository with relevant details.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The total number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  Details about the owner of the repository.
  """
  owner: Owner
}

"""
Represents the primary programming language used in a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}

"""
Details about the entity that owns a repository.
"""
type Owner {
  """
  The login name of the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A short biography of the owner.
  """
  bio: String
  """
  A list of repositories owned by the owner.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories and related information.
"""
type Repositories {
  """
  The total number of repositories in the collection.
  """
  totalCount: Int
  """
  A list of individual repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents a single repository within a collection.
"""
type Nodes {
  """
  The name of the individual repository node.
  """
  name: String
}
