"""
This type defines the entry point for fetching data from the GraphQL API.
"""
type Query {
  """
  Fetches a specific repository by its owner's username and repository name.
  """
  repository(
  """
  The username of the owner of the repository.
  """
  owner: String!
  """
  The name of the repository.
  """
  name: String!): Repository
}

"""
Represents a software repository, containing information like its name and owner.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of the repository.
  """
  description: String
  """
  The number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  Information about the owner of the repository.
  """
  owner: Owner
}

"""
Details the primary language used in a repository, including its name and color.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}

"""
Represents the owner of a repository, which can include their profile information.
"""
type Owner {
  """
  The username of the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A short biography of the owner.
  """
  bio: String
  """
  A collection of repositories owned by the owner.
  """
  repositories: Repositories
}

"""
A collection of repositories, providing a count and the individual nodes.
"""
type Repositories {
  """
  The total number of repositories in the collection.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository node with basic information.
"""
type Nodes {
  """
  The name of the repository node.
  """
  name: String
}
