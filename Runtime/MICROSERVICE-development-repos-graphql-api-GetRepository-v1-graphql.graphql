"""
The entry point for querying data in the application.
"""
type Query {
  """
  Fetches information about a specific repository.
  """
  repository(
  """
  The account that owns the repository.
  """
  owner: String!
  """
  The name of the repository.
  """
  name: String!): Repository
}

"""
Represents a code repository with various attributes.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief summary of the repository's purpose.
  """
  description: String
  """
  The number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  The owner of the repository.
  """
  owner: Owner
}

"""
Details about the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}

"""
Information about the account that owns the repository.
"""
type Owner {
  """
  The unique login identifier for the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A short biography or description of the owner.
  """
  bio: String
  """
  A collection of repositories owned by the account.
  """
  repositories: Repositories
}

"""
A collection of repositories with a count and list of nodes.
"""
type Repositories {
  """
  The total number of repositories.
  """
  totalCount: Int
  """
  The individual repositories in the collection.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository within a collection.
"""
type Nodes {
  """
  The name of the individual repository.
  """
  name: String
}
