type Query {
  repository(owner: String!, name: String!): Repository
}

type Repository {
  name: String
  description: String
  stargazerCount: Int
  forkCount: Int
  primaryLanguage: PrimaryLanguage
  owner: Owner
}

type PrimaryLanguage {
  name: String
  color: String
}

type Owner {
  login: String
  name: String
  bio: String
  repositories: Repositories
}

type Repositories {
  totalCount: Int
  nodes: [Nodes]
}

type Nodes {
  name: String
}
