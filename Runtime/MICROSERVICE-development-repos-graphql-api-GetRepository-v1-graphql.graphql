"""
Represents a set of entry points for fetching data.
"""
type Query {
  """
  Fetches a specific repository based on the owner's name and the repository name.
  """
  repository(
  """
  The username of the repository's owner, which is a required field.
  """
  owner: String!
  """
  The name of the repository, which is a required field.
  """
  name: String!): Repository
}

"""
Contains details about a specific repository.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief summary of the repository's purpose.
  """
  description: String
  """
  The total number of stars the repository has received.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  Information about the owner of the repository.
  """
  owner: Owner
}

"""
Represents the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the primary programming language.
  """
  name: String
  """
  The color typically associated with the programming language.
  """
  color: String
}

"""
Contains details about the owner of a repository.
"""
type Owner {
  """
  The username of the repository owner.
  """
  login: String
  """
  The full name of the repository owner.
  """
  name: String
  """
  A short biography of the repository owner.
  """
  bio: String
  """
  A collection of repositories owned by the user.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories.
"""
type Repositories {
  """
  The total number of repositories in the collection.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository within a collection.
"""
type Nodes {
  """
  The name of the repository.
  """
  name: String
}
