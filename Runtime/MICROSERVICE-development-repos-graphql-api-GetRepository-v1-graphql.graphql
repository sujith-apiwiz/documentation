"""
The root query for accessing repository information.
"""
type Query {
  """
  Fetches details about a specific repository based on the owner's username and the repository's name.
  """
  repository(
  """
  The username of the repository owner.
  """
  owner: String!
  """
  The name of the repository.
  """
  name: String!): Repository
}

"""
Represents a software repository containing code and related information.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A brief description of what the repository is about.
  """
  description: String
  """
  The total number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The primary programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  The owner of the repository.
  """
  owner: Owner
}

"""
Details about the primary programming language used in a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language.
  """
  color: String
}

"""
Information about the owner of a repository, including their profile details.
"""
type Owner {
  """
  The login username of the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A short biography or description of the owner.
  """
  bio: String
  """
  A list of repositories owned by this owner.
  """
  repositories: Repositories
}

"""
Represents a collection of repositories and related statistics.
"""
type Repositories {
  """
  The total number of repositories owned by the owner.
  """
  totalCount: Int
  """
  A list of repository nodes.
  """
  nodes: [Nodes]
}

"""
Details about a single repository in the collection.
"""
type Nodes {
  """
  The name of the repository node.
  """
  name: String
}
