"""
The root query type for accessing data from the GraphQL API.
"""
type Query {
  """
  Retrieves a specific repository based on the owner's account and the repository's name.
  """
  repository(
  """
  The username of the repository owner.
  """
  owner: String!
  """
  The name of the repository.
  """
  name: String!): Repository
}

"""
Represents a software repository containing source code and related metadata.
"""
type Repository {
  """
  The name of the repository.
  """
  name: String
  """
  A detailed description of what the repository is about.
  """
  description: String
  """
  The total number of users who have starred the repository.
  """
  stargazerCount: Int
  """
  The number of times the repository has been forked.
  """
  forkCount: Int
  """
  The main programming language used in the repository.
  """
  primaryLanguage: PrimaryLanguage
  """
  Information about the owner of the repository.
  """
  owner: Owner
}

"""
Represents the primary programming language of a repository.
"""
type PrimaryLanguage {
  """
  The name of the programming language.
  """
  name: String
  """
  The color associated with the programming language, often used in visual representations.
  """
  color: String
}

"""
Details about the owner of a repository, which can be a user or an organization.
"""
type Owner {
  """
  The login username of the owner.
  """
  login: String
  """
  The full name of the owner.
  """
  name: String
  """
  A biography or description about the owner.
  """
  bio: String
  """
  List of repositories owned by this owner.
  """
  repositories: Repositories
}

"""
A collection of repositories, showing the total count and individual nodes.
"""
type Repositories {
  """
  The total number of repositories owned.
  """
  totalCount: Int
  """
  An array containing individual repository nodes.
  """
  nodes: [Nodes]
}

"""
Represents an individual repository node in the list of repositories.
"""
type Nodes {
  """
  The name of the individual repository node.
  """
  name: String
}
