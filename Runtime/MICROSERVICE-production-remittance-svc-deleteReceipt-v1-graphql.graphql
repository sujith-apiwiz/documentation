"""
Handles mutations related to the data management of receipts.
"""
type Mutation {
  """
  Deletes a receipt based on the provided identifier.
  """
  deleteReceipt(
  """
  The unique identifier of the receipt to be deleted.
  """
  id: ID!): [DeleteReceipt]
}

"""
Represents the details of a receipt that has been deleted.
"""
type DeleteReceipt {
  """
  The unique identifier of the deleted receipt.
  """
