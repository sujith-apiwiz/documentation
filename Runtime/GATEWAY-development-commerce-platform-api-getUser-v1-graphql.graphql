"""
The root query type for the API, providing the entry point for retrieving data.
"""
type Query {
  """
  Fetches user information based on the provided criteria.
  """
  getUser: GetUser
}

"""
Represents the details of a user retrieved from the API.
"""
type GetUser {
  """
  A placeholder field that is currently empty.
  """
  _empty: String
}
