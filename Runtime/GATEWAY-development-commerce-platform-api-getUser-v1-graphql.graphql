"""
This type represents the entry point for all queries in the GraphQL API.
"""
type Query {
  """
  Fetches user information from the system.
  """
  getUser: GetUser
}

"""
This type encapsulates the user information returned by the getUser query.
"""
type GetUser {
  """
  A placeholder field that does not contain any meaningful data.
  """
  _empty: String
}
