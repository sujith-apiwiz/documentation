"""
The root query type for searching corridor fees.
"""
type Query {
  """
  Fetches a list of corridor fees based on the provided input parameters.
  """
  searchCorridorfees(
  """
  A JSON object containing the criteria for the search operation.
  """
  input: JSON!): [SearchCorridorfees]
}

"""
Represents the model for corridor fees including essential attributes.
"""
type SearchCorridorfees {
  """
  The unique identifier for the corridor fee.
  """
  id: Int
  """
  The name associated with the corridor fee.
  """
  name: String
  """
  The current status of the corridor fee.
  """
  status: String
  """
  The timestamp representing when the corridor fee was created.
  """
  createdAt: String
  """
  A unique code related to the corridor fee.
  """
  code: String
  """
  Details of the owner associated with the corridor fee.
  """
  owner: Owner
}

"""
Contains the details of an owner related to a corridor fee.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
