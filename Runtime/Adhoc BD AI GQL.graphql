"""
This type defines the entry point for fetching data.
"""
type Query {
  """
  Fetches the details of a specific product based on its ID.
  """
  getProduct(
  """
  The unique identifier for the product to be retrieved.
  """
  id: ID!): GetProduct
}

"""
Represents the details of a product.
"""
type GetProduct {
  """
  The unique identifier of the product.
  """
  id: ID
  """
  The name of the product.
  """
  name: String
  """
  The price of the product.
  """
  price: Float
}
