"""
Represents the entry point for retrieving data related to markers.
"""
type Query {
  """
  Retrieves a list of markers based on the provided input.
  """
  listMarkers(
  """
  A JSON object that contains the necessary parameters to filter or modify the list of markers.
  """
  input: JSON!): [ListMarkers]
}

"""
Represents the details of a specific marker.
"""
type ListMarkers {
  """
  The unique identifier of the marker.
  """
  id: Int
  """
  The name assigned to the marker.
  """
  name: String
  """
  The current status of the marker.
  """
  status: String
  """
  The date and time when the marker was created.
  """
  createdAt: String
  """
  The currency associated with the marker.
  """
  currency: String
}
