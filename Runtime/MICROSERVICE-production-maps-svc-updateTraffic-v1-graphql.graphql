"""
Handles modifications to the application's data.
"""
type Mutation {
  """
  Updates traffic information based on the provided identifier.
  """
  updateTraffic(
  """
  The unique identifier of the traffic entry to be updated.
  """
  id: ID!): [UpdateTraffic]
}

"""
Represents the data structure for updating traffic details.
"""
type UpdateTraffic {
  """
  The unique identifier for the traffic record.
  """
  id: Int
  """
  The name associated with the traffic record.
  """
  name: String
  """
  The current status of the traffic record.
  """
  status: String
  """
  The balance limit associated with the traffic record.
  """
  balanceLimit: Int
  """
  The currency type related to the traffic record.
  """
  currency: String
}

