"""
Operations that modify data within the system.
"""
type Mutation {
  """
  Updates an existing listing with new information.
  """
  updateListing(
  """
  The unique identifier of the listing to be updated.
  """
  id: ID!): [UpdateListing]
}

"""
Represents the updated details of a listing.
"""
type UpdateListing {
  """
  The unique identifier of the listing.
  """
