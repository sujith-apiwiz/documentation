"""
Handles all mutation operations related to the data.
"""
type Mutation {
  """
  Updates an existing viewing record in the system.
  """
  updateViewing(
  """
  The unique identifier of the viewing record to be updated.
  """
  id: ID!): [UpdateViewing]
}

"""
Represents the data structure for a viewing update.
"""
type UpdateViewing {
  """
  The unique identifier of the viewing.
  """
