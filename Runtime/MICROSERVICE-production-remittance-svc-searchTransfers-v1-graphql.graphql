"""
Represents the entry point for retrieving transfer-related data.
"""
type Query {
  """
  Retrieves a list of transfers based on specific search criteria.
  """
  searchTransfers(
  """
  The search criteria in JSON format.
  """
  input: JSON!): [SearchTransfers]
}

"""
Details about a specific transfer found through the search.
"""
type SearchTransfers {
  """
  The unique identifier for the transfer.
  """
  id: Int
  """
  The name associated with the transfer.
  """
  name: String
  """
  The current status of the transfer.
  """
  status: String
  """
  The limit on the balance associated with the transfer.
  """
  balanceLimit: Int
  """
  A specific code related to the transfer.
  """
  code: String
  """
  Information about the owner of the transfer.
  """
  owner: Owner
}

"""
Information about the individual or entity that owns the transfer.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
