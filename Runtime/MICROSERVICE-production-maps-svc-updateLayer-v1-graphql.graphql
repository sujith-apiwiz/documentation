"""
This type allows for modifying existing data, specifically focusing on updating layers.
"""
type Mutation {
  """
  Updates a layer based on the provided identifier.
  """
  updateLayer(
  """
  The unique identifier of the layer to be updated.
  """
  id: ID!): [UpdateLayer]
}

"""
Represents the updated attributes of a layer.
"""
type UpdateLayer {
  """
  The unique identifier of the layer.
  """
  id: Int
  """
  The name assigned to the layer.
  """
  name: String
  """
  The current status of the layer.
  """
  status: String
  """
  The timestamp indicating when the layer was created.
  """
  createdAt: String
  """
  The code associated with the layer.
  """
  code: String
}

