"""
Handles operations that modify data in the system.
"""
type Mutation {
  """
  Requests the deletion of a layer identified by its ID.
  """
  deleteLayer(
  """
  The unique identifier of the layer to be deleted.
  """
  id: ID!): [DeleteLayer]
}

"""
Represents the properties of a layer that has been marked for deletion.
"""
type DeleteLayer {
  """
  The unique identifier of the layer.
  """
  id: Int
  """
  The name assigned to the layer.
  """
  name: String
  """
  The current status of the layer.
  """
  status: String
  """
  The balance limit associated with the layer.
  """
  balanceLimit: Int
  """
  The type categorizing the layer.
  """
  type: String
}

