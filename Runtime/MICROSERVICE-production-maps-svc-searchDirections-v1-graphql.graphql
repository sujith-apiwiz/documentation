"""
This type represents the entry point for querying data.
"""
type Query {
  """
  Retrieves a list of search directions based on the provided input.
  """
  searchDirections(
  """
  A JSON object containing the necessary parameters to filter search directions.
  """
  input: JSON!): [SearchDirections]
}

"""
This type encompasses details about a specific search direction.
"""
type SearchDirections {
  """
  The unique identifier for the search direction.
  """
  id: Int
  """
  The name of the search direction.
  """
  name: String
  """
  The current status of the search direction.
  """
  status: String
  """
  A reference string associated with the search direction.
  """
  reference: String
  """
  The currency associated with the search direction.
  """
  currency: String
  """
  Information about the owner of the search direction.
  """
  owner: Owner
}

"""
This type provides details about the owner of a search direction.
"""
type Owner {
  """
  The unique identifier for the owner.
  """
  id: Int
  """
  The name of the owner.
  """
  name: String
  """
  The email address of the owner.
  """
  email: String
}
