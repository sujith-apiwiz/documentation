"""
The Query type serves as the entry point for fetching data in the GraphQL API.
"""
type Query {
  """
  Retrieves a list of users available in the system.
  """
  listUsers: ListUsers
}

"""
Represents a collection of users, potentially for pagination or filtering purposes.
"""
type ListUsers {
  """
  A placeholder field that may serve no specific purpose currently.
  """
  _empty: String
}
